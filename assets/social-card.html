<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryan Provost social card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      background: #f6f2e9;
      color: #18211f;
      font-family: "Manrope", sans-serif;
      grid-template-columns: 7fr 3fr;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 68px 70px 58px;
    }
    .identity { display: flex; align-items: center; gap: 18px; }
    .mark {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      border-radius: 50%;
      background: #173f35;
      color: #fffdf8;
      font-family: "Newsreader", Georgia, serif;
      font-size: 25px;
      font-weight: 600;
    }
    .name { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
    .role { margin-top: 2px; color: #9c482b; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    h1 {
      max-width: 790px;
      margin: 0;
      font-family: "Newsreader", Georgia, serif;
      font-size: 78px;
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.94;
    }
    .footer { display: flex; align-items: center; gap: 14px; color: #43504c; font-size: 17px; font-weight: 600; }
    .line { width: 64px; height: 2px; background: #bd5c37; }
    .panel { position: relative; overflow: hidden; background: #173f35; }
    .panel::before,
    .panel::after {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      content: "";
    }
    .panel::before { top: -130px; left: -150px; width: 560px; height: 560px; }
    .panel::after { top: -10px; left: -28px; width: 320px; height: 320px; }
    .accent { position: absolute; right: 52px; bottom: 58px; width: 82px; height: 82px; background: #bd5c37; }
  </style>
</head>
<body>
  <main class="content">
    <div class="identity">
      <div class="mark">RP</div>
      <div>
        <div class="name">Ryan Provost</div>
        <div class="role">Technology executive · operator · advisor</div>
      </div>
    </div>
    <h1>Complex programs.<br>Clear decisions.<br>Dependable delivery.</h1>
    <div class="footer"><span class="line"></span><span>aboutryan.com</span></div>
  </main>
  <aside class="panel" aria-hidden="true"><span class="accent"></span></aside>
</body>
</html>
